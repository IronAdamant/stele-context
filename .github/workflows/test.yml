name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Minimal install: package has zero runtime deps; pytest only for this job.
  search-regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install package + pytest
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install "pytest>=7"

    - name: Search regression marker
      run: pytest -m search_regression -q --tb=short

    - name: Search quality eval (keyword gate)
      run: |
        python benchmarks/eval_search_quality.py --search-mode keyword --json --min-recall 0.40

    - name: Search quality eval (hybrid + Tier-2 delta)
      run: |
        python benchmarks/eval_search_quality.py --tier2-delta --min-recall 0.30

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest --cov=stele_context --cov-report=xml --cov-report=term-missing --cov-fail-under=80

    - name: Upload coverage
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  test-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest -x -q

  test-mcp:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install package, MCP SDK, and PDF extra
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,mcp,pdf]"

    - name: Run tests against current mcp and pymupdf
      run: |
        pytest -q --tb=short

  # Fresh wheel, unpinned [mcp] (current 2.x) and newest mcp 1.x.
  mcp-stdio-smoke:
    name: MCP stdio smoke (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: unpinned-mcp-2
            mcp_major: "2"
            constraint: ""
          - label: latest-mcp-1
            mcp_major: "1"
            constraint: "mcp>=1.0.0,<2"
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build the wheel
      run: |
        python -m pip install --upgrade pip
        python -m pip install build
        python -m build --wheel

    - name: Install the wheel into a fresh venv
      run: |
        set -euo pipefail
        python -m venv "$RUNNER_TEMP/stele-mcp"
        "$RUNNER_TEMP/stele-mcp/bin/python" -m pip install --upgrade pip
        wheel=(dist/*.whl)
        constraint="${{ matrix.constraint }}"
        if [ -z "$constraint" ]; then
          "$RUNNER_TEMP/stele-mcp/bin/pip" install "${wheel[0]}[mcp]"
        else
          "$RUNNER_TEMP/stele-mcp/bin/pip" install "${wheel[0]}[mcp]" "$constraint"
        fi
        "$RUNNER_TEMP/stele-mcp/bin/python" -c 'import importlib.metadata as m; print("stele-context", m.version("stele-context")); print("mcp", m.version("mcp"))'

    - name: initialize, tools/list, and tools/call
      env:
        STELE_SMOKE_MCP_MAJOR: ${{ matrix.mcp_major }}
      run: |
        "$RUNNER_TEMP/stele-mcp/bin/python" scripts/mcp_stdio_smoke.py

  type-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install mypy

    - name: Run mypy
      run: |
        mypy stele_context/ --ignore-missing-imports

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Run ruff
      run: |
        ruff check stele_context/ tests/
        ruff format --check stele_context/ tests/
