name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'          # Enables fully automated releases from agents (Grok Build, etc.)
  workflow_dispatch:

# PyPI Trusted Publishing: short-lived OIDC token from GitHub — no PYPI_API_TOKEN secret.
# One-time setup: pypi.org → project → Publishing → add trusted publisher (GitHub + this repo + publish.yml).
#
# Trigger modes (for Grok Build / agent automation):
#   - Manual: Create a GitHub Release from a v* tag (current recommended for review)
#   - Automated: Push a `v*` tag (e.g. `git tag -a v1.3.2 -m "..." && git push origin v1.3.2`)
#     The workflow will build & publish automatically.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only run on version tags or published releases
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Determine release trigger
      run: |
        echo "Triggered by: ${{ github.event_name }}"
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          echo "Tag: ${{ github.ref_name }}"
        elif [[ "${{ github.event_name }}" == "release" ]]; then
          echo "Release: ${{ github.event.release.tag_name }}"
        fi

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Good for release tagging / changelog tooling in future

    - name: Verify version matches tag (important for automated releases)
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PYPROJECT_VERSION=$(python -c "
        import re, tomllib
        with open('pyproject.toml', 'rb') as f:
            data = tomllib.load(f)
        print(data['project']['version'])
        " 2>/dev/null || python -c "
        import re
        with open('pyproject.toml') as f:
            m = re.search(r'version\s*=\s*[\"\\']([^\"\\']+)[\"\\']', f.read())
            print(m.group(1) if m else 'unknown')
        ")
        echo "Tag version:    $TAG_VERSION"
        echo "pyproject.toml: $PYPROJECT_VERSION"
        if [[ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]]; then
          echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml ($PYPROJECT_VERSION)"
          exit 1
        fi
        echo "✓ Version verification passed"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true
