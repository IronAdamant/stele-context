name: Publish to PyPI

# This file stays on the python-legacy branch, which is the Python 1.x tree.
# A future 1.x publish is a pushed v1.* tag whose commit is on that branch.
# The tag push loads this workflow from the tagged commit, so it still runs
# after the file is gone from the default branch. Do not add a branches
# filter: a branches filter skips tag pushes.
#
# The release event is kept for a GitHub Release of a v1 tag. Pushing the
# tag is the trigger that does not depend on the default branch.

on:
  push:
    tags:
      - 'v1.*'        # 2.x tags publish Rust binaries only. They do not match this workflow.
  release:
    types: [published]
  workflow_dispatch:

# PyPI Trusted Publishing: short-lived OIDC token from GitHub — no PYPI_API_TOKEN secret.
# One-time setup: pypi.org → project → Publishing → add trusted publisher (GitHub + this repo + publish.yml).
#
# Trigger modes:
#   - Push a v1.* tag. v2.* does not match the tag filter, so it never starts this workflow.
#   - A published GitHub Release runs the workflow, and the job below skips every tag that is not v1.*.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Python packages stay on the 1.5 line. v2 tags publish Rust binaries
    # from release-rust.yml and must not upload a wheel.
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.')) ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v1.'))
    steps:
    - name: Determine release trigger
      run: |
        echo "Triggered by: ${{ github.event_name }}"
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          echo "Tag: ${{ github.ref_name }}"
        elif [[ "${{ github.event_name }}" == "release" ]]; then
          echo "Release: ${{ github.event.release.tag_name }}"
        fi

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Good for release tagging / changelog tooling in future

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Verify version matches tag (important for automated releases)
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PYPROJECT_VERSION=$(python -c "
        import re, tomllib
        with open('pyproject.toml', 'rb') as f:
            data = tomllib.load(f)
        print(data['project']['version'])
        " 2>/dev/null || python -c "
        import re
        with open('pyproject.toml') as f:
            m = re.search(r'version\s*=\s*[\"\\']([^\"\\']+)[\"\\']', f.read())
            print(m.group(1) if m else 'unknown')
        ")
        echo "Tag version:    $TAG_VERSION"
        echo "pyproject.toml: $PYPROJECT_VERSION"
        if [[ "$PYPROJECT_VERSION" != 1.* ]]; then
          echo "::error::Refusing to publish $PYPROJECT_VERSION. PyPI accepts only the 1.x line."
          exit 1
        fi
        if [[ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]]; then
          echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml ($PYPROJECT_VERSION)"
          exit 1
        fi
        echo "Version verification passed"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true
        # Both triggers (tag push + release published) can fire for the same
        # version; make the second run a no-op instead of a failure.
        skip-existing: true
