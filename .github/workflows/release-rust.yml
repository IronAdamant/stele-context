name: Rust release

# Tags named v2.* build the six release binaries and attach them to a
# GitHub Release. This workflow does not publish to PyPI.
on:
  push:
    tags:
      - "v2.*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            gcc: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl tools
        if: matrix.musl && matrix.os == 'ubuntu-latest' && matrix.cross != true
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: aarch64 gnu linker
        if: matrix.linker
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.gcc }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Pack
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/stele-context${ext}" "dist/stele-context-${{ matrix.target }}${ext}"
          cp "target/${{ matrix.target }}/release/stele-context-mcp${ext}" "dist/stele-context-mcp-${{ matrix.target }}${ext}"

      - uses: actions/upload-artifact@v4
        with:
          name: stele-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stele-*
          merge-multiple: true
          path: dist

      # One SHA256SUMS over the twelve binaries (it does not list itself).
      - name: Checksums
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --title "stele-context $tag" \
            --notes "Rust binaries for $tag. There is no PyPI package for 2.x. The Python 1.5 line stays on PyPI as a pointer release."
