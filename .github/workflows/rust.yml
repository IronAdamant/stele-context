name: Rust

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  rust:
    name: rust (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            test: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            test: false
          - os: macos-latest
            target: aarch64-apple-darwin
            test: true
          - os: macos-latest
            target: x86_64-apple-darwin
            test: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            test: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Format
        if: matrix.test && matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Zero dependencies
        if: matrix.test && matrix.os == 'ubuntu-latest'
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --release --target ${{ matrix.target }} --lib cargo_manifest_and_lock_are_std_only -- --exact

      - name: Fetch Python 1.5 reference
        if: matrix.test
        run: git fetch --depth=1 origin python-legacy

      - name: Python PDF extra for parity
        if: matrix.test
        shell: bash
        run: |
          python3 -m pip install 'pymupdf>=1.23' || python -m pip install 'pymupdf>=1.23'
          python3 -c 'import pymupdf' || python -c 'import pymupdf'

      - name: Fetch parity corpora
        if: matrix.test
        shell: bash
        run: bash scripts/fetch_corpora.sh

      - name: Test
        if: matrix.test
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --release --target ${{ matrix.target }}

      - name: Check
        if: ${{ !matrix.test }}
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --release --target ${{ matrix.target }}

      - name: Release binary
        if: matrix.test
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --release --target ${{ matrix.target }}

      - name: B1 hard floor against the Python 1.5.1 baseline
        if: matrix.test
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          "target/${{ matrix.target }}/release/stele-bench${ext}" floor \
            --binary "target/${{ matrix.target }}/release/stele-context${ext}" \
            --group b1 --runs 10 --check-floor

  # The cross targets above are cargo check. These three run the tests.
  # Linux, macOS, and Windows each have one native test job.
