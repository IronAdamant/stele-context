name: Rust

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  rust:
    name: rust (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            test: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            test: false
          # Intel images are a separate hosted pool. macos-latest is arm64, and
          # that pool has been cancelling jobs before a runner is assigned.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            test: true
          - os: macos-15-intel
            target: aarch64-apple-darwin
            test: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            test: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Format
        if: matrix.test && matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Zero dependencies
        if: matrix.test && matrix.os == 'ubuntu-latest'
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --release --target ${{ matrix.target }} --lib cargo_manifest_and_lock_are_std_only -- --exact

      - name: Fetch Python 1.5 reference
        if: matrix.test
        run: git fetch --depth=1 origin python-legacy

      - name: Python PDF extra for parity
        if: matrix.test
        shell: bash
        run: |
          python3 -m pip install 'pymupdf>=1.23' || true
          python -m pip install 'pymupdf>=1.23' || true
          python3 -c 'import pymupdf' || python -c 'import pymupdf'

      - name: Fetch parity corpora
        if: matrix.test
        shell: bash
        run: bash scripts/fetch_corpora.sh

      - name: Test
        if: matrix.test
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --release --target ${{ matrix.target }} -- --nocapture

      - name: Check
        if: ${{ !matrix.test }}
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --release --target ${{ matrix.target }}

      - name: Release binary
        if: matrix.test
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --release --target ${{ matrix.target }}

      - name: B1 hard floor against the Python 1.5.1 baseline
        if: matrix.test
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          "target/${{ matrix.target }}/release/stele-bench${ext}" floor \
            --binary "target/${{ matrix.target }}/release/stele-context${ext}" \
            --group b1 --runs 10 --check-floor

      - name: Same corpus versus Python 1.5.2
        if: matrix.test
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          py=python3
          if ! command -v python3 >/dev/null 2>&1; then py=python; fi
          "$py" scripts/versus_152.py \
            --binary "target/${{ matrix.target }}/release/stele-context${ext}" \
            --runs 3

  msrv:
    name: rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - name: Check the minimum supported compiler
        run: cargo check --locked

  # The cross targets above are cargo check. Linux, macOS (Intel), and
  # Windows each have one native test job. The 1.89 job is the MSRV.
