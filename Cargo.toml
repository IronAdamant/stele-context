[package]
name = "stele-context"
version = "2.2.0"
edition = "2021"
rust-version = "1.89"
description = "Local context cache for AI coding agents. Rust 2.0, std only."
license = "MIT"
publish = false

[dependencies]

[dev-dependencies]

[[bin]]
name = "stele-context"
path = "src/main.rs"

[[bin]]
name = "stele-context-mcp"
path = "src/bin/stele-context-mcp.rs"

# One codegen unit with link-time optimization: a smaller binary whose hot
# paths sit on fewer pages, which is what process start and the
# benchmark gate's CLI rows measure.
[profile.release]
lto = "fat"
codegen-units = 1
